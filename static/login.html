<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — GearHeadSpecs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Spec Tree Platform</div>
    <h1 class="brand-name">GearHeadSpecs</h1>
  </div>
</header>

<main style="max-width:440px">
  <div class="panel">
    <div class="panel-head"><h3>Sign In</h3></div>
    <div class="panel-body">
      <form id="login-form">
        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" autofocus>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="primary-btn" id="submit-btn">Sign In</button>
          <a class="ghost-link" id="forgot-link" href="/forgot.html" hidden
             style="font-size:11.5px;color:var(--text-dim)">Forgotten your password?</a>
        </div>
      </form>

      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
                  font-size:12.5px;color:var(--text-dim)">
        No account yet?
        <a id="to-register" href="/register.html" style="color:var(--amber)">Create one</a>.
      </div>
    </div>
  </div>

</main>

<script src="/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
// Signing in lands on the home page, whatever page sent you here: the nav
// and the counts are drawn at load, so the first page after signing in is
// the one that should be freshly yours. ?next= is still carried to the
// register page so the two pages agree with each other.
const next = params.get("next") || "/index.html";
const after = "/index.html";
document.getElementById("to-register").href =
  "/register.html?next=" + encodeURIComponent(next);

document.getElementById("login-form").addEventListener("submit", guard(async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  try {
    await API.post("/api/auth/login", {
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value,
    });
    location.href = after;
  } finally {
    btn.disabled = false;
  }
}));

initChrome("/login.html").then(() => {
  // Shown only when the site can actually send the mail.
  const link = document.getElementById("forgot-link");
  if(link && ME && ME.mail) link.hidden = false;
});
</script>
</body>
</html>
