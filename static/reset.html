<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a New Password — GearHeadSpecs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  main{ max-width: 460px; }
  .rule{ font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }
  .rule.ok{ color: var(--good); }
  .rule .mark{ font-family: var(--mono); margin-right: 5px; }
  .form-actions{ display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .form-actions a{ text-decoration: none; font-size: 11.5px; color: var(--text-dim); }
  .said{
    border: 1px solid var(--line); border-left: 2px solid var(--amber);
    background: var(--panel-2); padding: 15px 17px; font-size: 12.5px;
    line-height: 1.65; color: var(--text-dim);
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Spec Tree Platform</div>
    <h1>Set a New Password</h1>
  </div>
</header>

<main>
  <div id="content"><div class="panel"><div class="loading">Loading…</div></div></div>
</main>

<script src="/api.js"></script>
<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";

function form(){
  return `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Choose a new one</h3>
          <p>Setting it signs you out everywhere else — which is the point, if
             somebody else had got in.</p></div>
      </div>
      <div class="panel-body">
        <div class="form-row">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password">
          <div class="rule" id="r-len"><span class="mark">·</span>at least 8 characters</div>
        </div>
        <div class="form-row">
          <label for="confirm">Type it again</label>
          <input type="password" id="confirm" autocomplete="new-password">
          <div class="rule" id="r-match"><span class="mark">·</span>both the same</div>
        </div>
        <div class="form-actions">
          <button class="primary-btn" id="save">Set the password</button>
          <a href="/login.html">Back to sign in</a>
        </div>
      </div>
    </div>`;
}

function check(){
  const p = byId("password").value, c = byId("confirm").value;
  const rules = { "r-len": p.length >= 8, "r-match": !!p && p === c };
  for(const [id, ok] of Object.entries(rules)){
    const el = byId(id);
    el.classList.toggle("ok", ok);
    el.querySelector(".mark").textContent = ok ? "✓" : "·";
  }
  return rules["r-len"] && rules["r-match"];
}

document.addEventListener("input", (e) => {
  if(["password", "confirm"].includes(e.target.id)) check();
});

document.addEventListener("click", guard(async (e) => {
  if(e.target.id !== "save") return;
  if(!check()){ toast("Eight characters or more, and both boxes the same.", "error"); return; }
  const btn = byId("save");
  btn.disabled = true;
  try {
    const r = await API.post("/api/auth/reset", {
      token: TOKEN, password: byId("password").value });
    byId("content").innerHTML = `
      <div class="panel">
        <div class="panel-head"><div><h3>Done</h3>
          <p>The password for <b>${esc(r.username)}</b> is set.</p></div></div>
        <div class="panel-body">
          <div class="said">Every other session has been signed out. Sign in with the
            new password.</div>
          <div class="form-actions">
            <a class="primary-btn" style="text-decoration:none" href="/login.html">Sign in</a>
          </div>
        </div>
      </div>`;
  } finally {
    btn.disabled = false;
  }
}));

(async () => {
  await initChrome(null);
  byId("content").innerHTML = TOKEN ? form() : `
    <div class="panel">
      <div class="panel-head"><div><h3>No link here</h3>
        <p>This page needs the link from the email.</p></div></div>
      <div class="panel-body">
        <div class="said">Open the link in the mail we sent, or
          <a href="/forgot.html">ask for a new one</a> if it has expired.</div>
      </div>
    </div>`;
  if(TOKEN) check();
})();
</script>
</body>
</html>
