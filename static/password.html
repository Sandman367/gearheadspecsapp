<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — GearHeadSpecs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .form-row{ margin-bottom: 12px; }
  .form-row label{ display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: 4px; }
  .form-row input{ width: 100%; }
  .form-note{ font-size: 11px; color: var(--text-faint); margin-top: 4px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Spec Tree Platform</div>
    <h1>Change Password</h1>
  </div>
  <div class="manager-tag" id="who"></div>
</header>

<main style="max-width:520px">
  <div id="content"><div class="loading">Loading…</div></div>
</main>

<script src="/api.js"></script>
<script>
(async () => {
  await initChrome(null);
  if(!requireRole("user")) return;
  document.getElementById("who").textContent = `${ME.user.username} · ${ME.user.role}`;
  document.getElementById("content").innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><h3>${esc(ME.user.username)}</h3>
        <p>Your current password proves it is you. Other devices where you are signed in are signed out; this one stays.</p></div></div>
      <div class="panel-body">
        <div class="form-row"><label for="pw-current">Current password</label><input type="password" id="pw-current" autocomplete="current-password"></div>
        <div class="form-row"><label for="pw-new">New password</label><input type="password" id="pw-new" autocomplete="new-password" minlength="8">
          <div class="form-note">At least 8 characters.</div></div>
        <div class="form-row"><label for="pw-again">New password again</label><input type="password" id="pw-again" autocomplete="new-password"></div>
        <div class="form-actions" style="display:flex;gap:8px">
          <button class="primary-btn" id="pw-save">Change password</button>
          <a class="ghost-btn" style="text-decoration:none" href="/index.html">Cancel</a>
        </div>
      </div>
    </div>`;
  document.getElementById("pw-save").addEventListener("click", guard(async () => {
    const cur = document.getElementById("pw-current").value;
    const nw = document.getElementById("pw-new").value;
    if(nw.length < 8){ toast("Use at least 8 characters.", "error"); return; }
    if(nw !== document.getElementById("pw-again").value){ toast("The new passwords don't match.", "error"); return; }
    await API.post("/api/auth/password", { current: cur, password: nw });
    toast("Password changed.", "ok");
    ["pw-current", "pw-new", "pw-again"].forEach(id => { document.getElementById(id).value = ""; });
  }));
})();
</script>
</body>
</html>
